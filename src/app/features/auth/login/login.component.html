<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card mt-5">
        <div class="card-header text-center">
          <h4>{{ 'AUTH.LOGIN' | translate }}</h4>
        </div>
        <div class="card-body">
          <!-- رسالة الخطأ -->
          <div *ngIf="error" class="alert alert-danger mb-3">
            {{ error }}
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="email" class="form-label">{{ 'AUTH.EMAIL' | translate }}</label>
              <input
                type="email"
                class="form-control"
                id="email"
                formControlName="email"
                [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
                [disabled]="loading"
              />
              <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
                <div *ngIf="f['email'].errors['required']">{{ 'AUTH.EMAIL_REQUIRED' | translate }}</div>
                <div *ngIf="f['email'].errors['email']">{{ 'AUTH.EMAIL_INVALID' | translate }}</div>
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">{{ 'AUTH.PASSWORD' | translate }}</label>
              <input
                type="password"
                class="form-control"
                id="password"
                formControlName="password"
                [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
                [disabled]="loading"
              />
              <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                <div *ngIf="f['password'].errors['required']">{{ 'AUTH.PASSWORD_REQUIRED' | translate }}</div>
                <div *ngIf="f['password'].errors['minlength']">{{ 'AUTH.PASSWORD_LENGTH' | translate }}</div>
              </div>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label" for="rememberMe">{{ 'AUTH.REMEMBER_ME' | translate }}</label>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                {{ 'AUTH.LOGIN_BUTTON' | translate }}
              </button>
            </div>
          </form>
        </div>
        <div class="card-footer text-center">
          <p class="mb-0">
            {{ 'AUTH.NO_ACCOUNT' | translate }} <a routerLink="/auth/register">{{ 'AUTH.REGISTER' | translate }}</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
